    comment: "DESY PETRA storage ring operated parasitically (during HERA-injector idle time) as a synchrotron radiation source from 1995-2007, using a single hard X-ray undulator (33 mm period) in straight section North East; this is the ring later rebuilt into PETRA III. Horizontal emittance 18 nm rad at 12 GeV with the low-emittance optic, 3% emittance coupling. Current: up to 55-60 mA design; energy spread not given in this source (assumed value is used here). Values are for the low-emittance undulator optic (as opposed to the standard 45-degree-phase-advance injection optic used for HERA injection, which had 18 nm rad emittance at 7 GeV). Compiled by Claude Sonnet 5.0 (medium), verify before use for important calculations."
